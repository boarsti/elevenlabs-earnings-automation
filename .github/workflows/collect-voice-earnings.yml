name: ElevenLabs Voice Earnings Collector

on:
  schedule:
    # 1x taeglich, nach 22:00 Uhr deutscher Zeit (Nutzer-Anforderung 25.08.2026).
    # GitHub-Cron laeuft immer in UTC ohne Sommerzeit-Anpassung - 21:15 UTC ist im
    # Winter (UTC+1) 22:15 Uhr lokal, im Sommer (UTC+2) 23:15 Uhr lokal - so bleibt
    # es in BEIDEN Faellen "nach 22 Uhr", nie davor.
    - cron: "15 21 * * *"
  workflow_dispatch: {} # manueller Start zum Testen ueber den "Actions"-Tab

jobs:
  collect:
    runs-on: ubuntu-latest
    # Eigenes, grosszuegigeres Timeout als der Haupt-Collector (5 Min) - dieser Lauf
    # macht pro Tag zwei CSV-Exporte (Tab-Wechsel + Menue-Klick + Download je Tab)
    # statt nur eines schnellen Seitenaufrufs.
    timeout-minutes: 8
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run voice earnings collector
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ELEVENLABS_STORAGE_STATE: ${{ secrets.ELEVENLABS_STORAGE_STATE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run collect-voice-earnings
