<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ElevenLabs Einnahmen</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { background: var(--card-bg); border: 1px solid var(--card-border); }
  :root { --card-bg: #ffffff; --card-border: #e5e7eb; --bg: #f8fafc; --text: #0f172a; --muted: #64748b; }
  @media (prefers-color-scheme: dark) {
    :root { --card-bg: #111827; --card-border: #1f2937; --bg: #0b1120; --text: #f1f5f9; --muted: #94a3b8; }
  }
  body { background: var(--bg); color: var(--text); }
  .muted { color: var(--muted); }
</style>
</head>
<body class="min-h-screen p-6">

  <!-- ============================================================
       KONFIGURATION - hier deine Werte aus apps-script/README.md eintragen
       ============================================================ -->
  <script>
    const BRIDGE_URL = "HIER_DEINE_APPS_SCRIPT_WEB_APP_URL_EINTRAGEN"; // endet auf /exec
    const BRIDGE_TOKEN = "HIER_DEIN_TOKEN_EINTRAGEN";
    const POLL_INTERVAL_MS = 10 * 60 * 1000; // 10 Minuten
  </script>

  <div class="max-w-5xl mx-auto space-y-6">

    <header class="text-center space-y-1">
      <p id="readoutLabel" class="text-sm muted">Ablesezeit diese Woche: —</p>
      <p id="sinceReadout" class="text-6xl font-bold tabular-nums">$0.00</p>
      <p class="text-sm muted">seit gestern dieser Uhrzeit</p>
      <p id="staleWarning" class="hidden text-amber-500 text-sm mt-2">⚠️ Daten veraltet</p>
    </header>

    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="card rounded-2xl p-4">
        <p class="text-xs muted">Current Period</p>
        <p id="currentPeriod" class="text-2xl font-semibold tabular-nums">—</p>
      </div>
      <div class="card rounded-2xl p-4">
        <p class="text-xs muted">All-Time Payouts</p>
        <p id="allTime" class="text-2xl font-semibold tabular-nums">—</p>
      </div>
      <div class="card rounded-2xl p-4">
        <p class="text-xs muted">Diese Woche (EUR)</p>
        <p id="thisWeek" class="text-2xl font-semibold tabular-nums">—</p>
      </div>
      <div class="card rounded-2xl p-4">
        <p class="text-xs muted">Dieser Monat (Ø/Tag)</p>
        <p id="thisMonthAvg" class="text-2xl font-semibold tabular-nums">—</p>
      </div>
    </section>

    <section class="card rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Verlauf</h2>
        <div class="flex gap-2 text-sm">
          <button data-range="daily" class="range-btn px-3 py-1 rounded-full bg-blue-600 text-white">Tag</button>
          <button data-range="weekly" class="range-btn px-3 py-1 rounded-full">Woche</button>
          <button data-range="monthly" class="range-btn px-3 py-1 rounded-full">Monat</button>
        </div>
      </div>
      <canvas id="historyChart" height="90"></canvas>
    </section>

    <section class="card rounded-2xl p-4">
      <h2 class="font-semibold mb-3">Letzte Auszahlungen</h2>
      <table class="w-full text-sm">
        <thead class="muted text-left">
          <tr><th class="py-1">Woche ab</th><th>EUR</th></tr>
        </thead>
        <tbody id="historyTableBody"></tbody>
      </table>
    </section>

    <p class="text-center text-xs muted">Letzte Aktualisierung: <span id="lastUpdated">—</span></p>
  </div>

<script>
let chart;
let latestData = null;

async function fetchData() {
  const url = `${BRIDGE_URL}?token=${encodeURIComponent(BRIDGE_TOKEN)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function fmtUsd(n) { return `$${Number(n ?? 0).toFixed(2)}`; }
function fmtEur(n) { return `€${Number(n ?? 0).toFixed(2)}`; }

function render(data) {
  latestData = data;
  document.getElementById("readoutLabel").textContent = `Ablesezeit diese Woche: ${data.readoutTimeWeekly || "—"}`;
  document.getElementById("sinceReadout").textContent = fmtUsd(data.sinceReadoutUsd);
  document.getElementById("currentPeriod").textContent = fmtUsd(data.currentPeriodUsd);
  document.getElementById("allTime").textContent = fmtEur(data.allTimePayoutsEur);

  const weekly = data.history?.weekly ?? [];
  document.getElementById("thisWeek").textContent = weekly.length
    ? fmtEur(weekly[weekly.length - 1].eur)
    : "—";

  const monthly = data.history?.monthly ?? [];
  document.getElementById("thisMonthAvg").textContent = monthly.length
    ? fmtUsd(monthly[monthly.length - 1].avgUsd)
    : "—";

  document.getElementById("staleWarning").classList.toggle("hidden", !data.stale);
  document.getElementById("lastUpdated").textContent = data.lastUpdated
    ? new Date(data.lastUpdated).toLocaleString("de-DE")
    : "—";

  const tbody = document.getElementById("historyTableBody");
  tbody.innerHTML = weekly.slice(-10).reverse().map(w =>
    `<tr class="border-t" style="border-color:var(--card-border)"><td class="py-1">${w.weekStart}</td><td>${fmtEur(w.eur)}</td></tr>`
  ).join("");

  updateChart("daily");
}

function updateChart(range) {
  if (!latestData) return;
  document.querySelectorAll(".range-btn").forEach(b => {
    const active = b.dataset.range === range;
    b.classList.toggle("bg-blue-600", active);
    b.classList.toggle("text-white", active);
  });

  const series = latestData.history?.[range] ?? [];
  const labels = series.map(p => p.date ?? p.weekStart ?? p.month);
  const values = series.map(p => p.usd ?? p.eur ?? 0);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("historyChart"), {
    type: "line",
    data: { labels, datasets: [{ data: values, borderColor: "#2563eb", tension: 0.3, fill: false }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 12 } } } },
  });
}

document.querySelectorAll(".range-btn").forEach(b =>
  b.addEventListener("click", () => updateChart(b.dataset.range))
);

async function tick() {
  try {
    render(await fetchData());
  } catch (e) {
    console.error("Konnte Daten nicht laden:", e);
  }
}

tick();
setInterval(tick, POLL_INTERVAL_MS);
</script>
</body>
</html>
